services:
  master:
    build:
      context: .
      dockerfile: Dockerfile.panel
    restart: unless-stopped
    environment:
      SENTINEL_PUBLIC_URL: https://${SENTINEL_DOMAIN:?Set SENTINEL_DOMAIN in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - sentinel_state:/state
    networks: [sentinel]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SENTINEL_DOMAIN: ${SENTINEL_DOMAIN:?Set SENTINEL_DOMAIN in .env}
    volumes:
      - ./panel/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [master]
    networks: [sentinel]
volumes:
  sentinel_state:
  caddy_data:
  caddy_config:
networks:
  sentinel:
