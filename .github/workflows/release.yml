name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, matching frontend/API/Agent (for example v0.2.0)'
        required: true
        type: string
        default: v0.2.0

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version and branch
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python scripts/build_release.py "$RELEASE_VERSION" --check
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    uses: ./.github/workflows/verify.yml

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build production frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build and check release package
        run: |
          python scripts/build_release.py "$RELEASE_VERSION"
          cd release-dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: release-dist/
          retention-days: 30
      - name: Tag tested commit and publish release
        run: |
          if git rev-parse --verify "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/$RELEASE_VERSION^{}")" = "$GITHUB_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_VERSION" "$GITHUB_SHA" -m "VPS Sentinel Dash $RELEASE_VERSION"
            git push origin "refs/tags/$RELEASE_VERSION"
          fi
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > /tmp/release-draft-state; then
            test "$(cat /tmp/release-draft-state)" = true
          else
            gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "VPS Sentinel Dash $RELEASE_VERSION" --notes-file release-dist/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
            "release-dist/VPS-Sentinel-Dash-$RELEASE_VERSION.tar.gz" \
            release-dist/install.sh release-dist/sentinel_agent.py release-dist/release.json release-dist/SHA256SUMS
          gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
            --title "VPS Sentinel Dash $RELEASE_VERSION" --notes-file release-dist/RELEASE_NOTES.md
